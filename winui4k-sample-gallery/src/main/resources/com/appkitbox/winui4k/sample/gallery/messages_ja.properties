scrollview.example.image.note=Ctrl+マウスホイール、またはタッチのピンチでズームできます。右の設定で挙動を変えられます。
scrollview.example.image.title=画像のズーム (ZoomMode / ContentOrientation / ScrollBarVisibility)
scrollview.example.programmatic.position=位置: ({0}, {1})
scrollview.example.programmatic.start=先頭へ
scrollview.example.programmatic.end=末尾へ
scrollview.example.programmatic.down=下へ +100
scrollview.example.programmatic.right=右へ +100
scrollview.example.programmatic.note=ScrollTo は絶対位置、ScrollBy は現在位置からの相対量でアニメーション付きにスクロールします。
scrollview.example.programmatic.title=プログラムからのスクロール (ScrollTo / ScrollBy / ViewChanged)
# ---- ScrollViewerPage ----
scrollviewer.description=表示領域より大きい中身をスクロールして見せる従来のコンテナです。WScrollPane の各機能を試せます。
scrollviewer.example.visibility.title=スクロールバーの表示方法 (HorizontalScrollBarVisibility / VerticalScrollBarVisibility)
scrollviewer.example.programmatic.position=横位置: {0} / スクロール可能幅: {1}
scrollviewer.example.programmatic.left=左端へ
scrollviewer.example.programmatic.right=右端へ
scrollviewer.example.programmatic.center=中央へ
scrollviewer.example.programmatic.note=ScrollToHorizontalOffset (ChangeView) でアニメーション付きに横スクロールします。
scrollviewer.example.programmatic.title=プログラムからの横スクロール (ChangeView / ViewChanged)
# ---- SemanticZoomPage ----
semanticzoom.description=1 つのコレクションに対する詳細ビューと概要ビューを切り替えて、大きなコレクションをたどりやすくするコントロールです。WSemanticZoom の各機能を試せます。(本家はグループ化した CollectionViewSource を用いますが、winui4k には未整備のため、ここでは詳細ビュー = 全項目、概要ビュー = 範囲ラベルの簡略構成です)
semanticzoom.example.item=アイテム {0}
semanticzoom.example.range=アイテム {0}〜{1}
semanticzoom.example.active.in=表示中: 詳細ビュー (ZoomedIn)
semanticzoom.example.active.out=表示中: 概要ビュー (ZoomedOut)
semanticzoom.example.toggle=ビューを切り替え (ToggleActiveView)
semanticzoom.example.note=Ctrl+マウスホイールの縮小、または概要ビュー左下のズームアウトボタンでも切り替えられます。
semanticzoom.example.title=ビューの切り替え (ZoomedInView / ZoomedOutView / ToggleActiveView)
