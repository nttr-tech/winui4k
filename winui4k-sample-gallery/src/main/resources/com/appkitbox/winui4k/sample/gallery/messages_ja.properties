# ---- CalendarViewPage ----
calendarview.description=カレンダーを常時表示して日付を選択できるコントロールです。SelectionMode で選択方法を、DisplayMode で月/年/十年ビューを切り替えられます。
calendarview.example.calendar.title=カレンダー表示 (SelectionMode / IsGroupLabelVisible / IsOutOfScopeEnabled / CalendarIdentifier)
