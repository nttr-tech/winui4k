# ---- Storage pickers ----
storagepickers.description=OS のファイル / フォルダー選択ダイアログを開く WinAppSDK のピッカーです。WFileOpenPicker (開く)、WFileSavePicker (名前を付けて保存)、WFolderPicker (フォルダーの選択) を試せます。
storagepickers.guide.open=・WFileOpenPicker — ファイルを開く。pickSingleFile (単一) / pickMultipleFiles (複数)
storagepickers.guide.save=・WFileSavePicker — 名前を付けて保存。pickSaveFile (保存先のパスを返すだけでファイルは作らない)
storagepickers.guide.folder=・WFolderPicker — フォルダーの選択。pickSingleFolder
storagepickers.guide.usage=使い方: オーナーの WFrame を渡してピッカーを作り、ファイルの種類などを設定してから開きます。ダイアログはユーザーが閉じるまで開いたままなので、結果は UI スレッド上のコールバックで受け取ります (キャンセル時は null、複数選択は空のリスト)。
storagepickers.guide.note=ピッカーは前回選択した場所と表示形式を記憶して再現します。SuggestedStartLocation と ViewMode が効くのは初回表示時 (記憶がまだ無いとき) だけです。
storagepickers.guide.title=ガイド: ピッカーの使い分けと共通の使い方
