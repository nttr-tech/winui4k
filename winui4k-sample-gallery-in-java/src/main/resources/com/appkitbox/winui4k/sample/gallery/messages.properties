# ---- Storage pickers ----
storagepickers.description=WinAppSDK pickers that open the system file and folder dialogs. Try WFileOpenPicker (open), WFileSavePicker (save as), and WFolderPicker (select a folder).
storagepickers.guide.open=• WFileOpenPicker — Opens files. pickSingleFile (one file) / pickMultipleFiles (multiple files)
storagepickers.guide.save=• WFileSavePicker — Save as. pickSaveFile (only returns the path; it doesn't create the file)
storagepickers.guide.folder=• WFolderPicker — Selects a folder. pickSingleFolder
storagepickers.guide.usage=Usage: Create a picker with the owner WFrame, set options such as file types, and then open it. The dialog stays open until the user closes it, so you receive the result in a callback on the UI thread (null when canceled, an empty list for multiple selection).
storagepickers.guide.note=Pickers remember the last location and view mode and restore them. SuggestedStartLocation and ViewMode only take effect the first time a picker is shown (before anything is remembered).
