inkcanvas.description=A canvas for drawing handwritten strokes (ink) with a pen, mouse, or touch. Like JTable and TableModel in Swing, the stroke data lives in an InkStrokeModel (com.appkitbox.winui4k.ink), and WInkCanvas handles its display and input.
inkcanvas.guide.canvas=• WInkCanvas — The canvas (view) you draw on. Writes drawn and erased strokes back to the model
inkcanvas.guide.presenter=• WInkPresenter — Input devices, processing mode, drawing attributes for new strokes, and input events (canvas.inkPresenter)
inkcanvas.guide.model=• InkStrokeModel / DefaultInkStrokeModel — The model for the list of strokes. One model can be shared by several canvases
inkcanvas.guide.values=• InkStroke / InkPoint / InkDrawingAttributes — Value objects for strokes, points, and drawing styles (independent of WinUI)
inkcanvas.guide.sync=Strokes added to, replaced in, or removed from the model appear on the canvas, and strokes drawn or erased on the canvas, as well as moved or deleted selections, are reflected in the model.
inkcanvas.guide.note=InkCanvas is an experimental feature of Windows App SDK 2.5. It accepts only pen input by default, so the canvases on this page also accept mouse and touch.
inkcanvas.guide.title=Guide: class roles
