# ---- Clipboard ----
clipboard.description=Read and write the system clipboard. To copy, put the content in a DataPackage and pass it to Clipboard.setContent. To paste, get a DataPackageView from Clipboard.getContent and read from it.
clipboard.list.item=• {0}
clipboard.guide.clipboard=• Clipboard — The system clipboard. setContent / getContent / clear / addContentChangedListener
clipboard.guide.datapackage=• DataPackage — Holds the content to copy. setText / setHtmlFormat / setRtf / setUri / setStorageItems
clipboard.guide.datapackageview=• DataPackageView — A read-only view for pasting. Check the format with contains, then read it with getText and so on
clipboard.guide.standarddataformats=• StandardDataFormats — Format name constants (TEXT / HTML / RTF / WEB_LINK / STORAGE_ITEMS and more)
clipboard.guide.contentoptions=• ClipboardContentOptions — Options that control clipboard history (Win+V) and roaming
clipboard.guide.async=Reading is asynchronous because it requests the data from the source app; the result arrives in a callback on the UI thread. A single DataPackage can hold several formats at once.
clipboard.guide.note=The clipboard is accessible only while the window is in the foreground. Reading and writing images (Bitmap format) is not supported yet.
clipboard.guide.title=Guide: classes and the copy / paste flow
